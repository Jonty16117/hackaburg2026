<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>DuckBot Dashboard</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font:14px/1.4 monospace;background:#0d1b2a;color:#e0e0e0;display:flex;height:100vh;overflow:hidden}
#map text{user-select:none;-webkit-user-select:none}
#map{flex:1;background:#0a1628;cursor:crosshair;min-width:0}
#panel{width:280px;background:#111d2e;padding:12px;overflow-y:auto;display:flex;flex-direction:column;gap:10px;border-left:2px solid #1a3a5c}
h2{font-size:13px;color:#4fc3f7;text-transform:uppercase;letter-spacing:1px;border-bottom:1px solid #1a3a5c;padding-bottom:4px;margin-top:4px}
.mode{display:flex;gap:4px}
.mode button{flex:1;padding:6px;border:none;cursor:pointer;font:inherit;font-weight:bold;border-radius:4px;background:#1a3a5c;color:#889}
.mode button.active{background:#1565c0;color:#fff}
.ws-status{font-size:11px;padding:2px 6px;border-radius:3px;display:inline-block}
.ws-on{background:#1b5e20;color:#81c784}
.ws-off{background:#4a1a1a;color:#ef9a9a}
label{font-size:12px;color:#90a4ae;display:flex;justify-content:space-between;align-items:center}
label span{min-width:42px;text-align:right;color:#4fc3f7;font-weight:bold}
input[type=range]{width:100%;accent-color:#4fc3f7;margin:2px 0}
input[type=text]{padding:4px 6px;border:1px solid #1a3a5c;background:#0d1b2a;color:#e0e0e0;border-radius:3px;font:inherit}
.btn-row{display:flex;gap:4px}
.btn-row button{flex:1;padding:6px;border:none;cursor:pointer;font:inherit;font-weight:bold;border-radius:4px}
.btn-start{background:#1b5e20;color:#81c784}
.btn-stop{background:#4a1a1a;color:#ef9a9a}
.btn-neutral{background:#1a3a5c;color:#ccc}

.telem{font-size:12px;width:100%}
.telem td{padding:2px 6px}
.telem td:first-child{color:#90a4ae;text-align:right;white-space:nowrap}
.telem td:last-child{color:#4fc3f7;font-weight:bold}
.conn-row{display:flex;gap:4px;align-items:center}
#pi-ip{flex:1}
button:disabled{opacity:0.4;cursor:default}
</style>
</head>
<body>

<svg id="map" viewBox="-30 -10 1060 220" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <pattern id="grid" width="50" height="50" patternUnits="userSpaceOnUse">
      <path d="M 50 0 L 0 0 0 50" fill="none" stroke="#123456" stroke-width="0.3"/>
    </pattern>
  </defs>
  <rect x="0" y="0" width="1000" height="200" fill="url(#grid)"/>
  <rect x="0" y="0" width="1000" height="200" fill="none" stroke="#2d6ea0" stroke-width="3" rx="4"/>
  <text x="500" y="110" fill="#123456" font-size="20" text-anchor="middle" opacity="0.4">DuckBot Pool</text>
  <text x="500" y="192" fill="#1a3a5c" font-size="10" text-anchor="middle">1000 cm (10 m)</text>
  <g id="obstacles"></g>
  <polyline id="trail" fill="none" stroke="#00ff8850" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <line id="beam-front" x1="0" y1="0" x2="0" y2="0" stroke="#00ff8860" stroke-width="2" stroke-linecap="round"/>
  <line id="beam-left" x1="0" y1="0" x2="0" y2="0" stroke="#ffcc0060" stroke-width="2" stroke-linecap="round"/>
  <line id="beam-right" x1="0" y1="0" x2="0" y2="0" stroke="#ffcc0060" stroke-width="2" stroke-linecap="round"/>
  <circle id="beam-front-pt" cx="0" cy="0" r="3" fill="#00ff88" opacity="0"/>
  <circle id="beam-left-pt" cx="0" cy="0" r="3" fill="#ffcc00" opacity="0"/>
  <circle id="beam-right-pt" cx="0" cy="0" r="3" fill="#ffcc00" opacity="0"/>
  <circle id="duck-ring" cx="500" cy="100" r="15" fill="none" stroke="#ff444420" stroke-width="1.5" stroke-dasharray="4,3"/>
  <polygon id="duck" points="0,-7 16,0 0,7" fill="#ff4444" stroke="#ff6666" stroke-width="1.5" stroke-linejoin="round"/>
  <g id="start-marker" cursor="grab">
    <circle id="start-pt" cx="500" cy="100" r="5" fill="#00ff88" stroke="#00ff88" stroke-width="1.5"/>
    <text id="start-label" x="500" y="86" fill="#00ff88" font-size="11" text-anchor="middle" font-weight="bold">S</text>
  </g>
  <g id="end-marker" cursor="grab">
    <circle id="end-pt" cx="900" cy="100" r="5" fill="none" stroke="#42a5f5" stroke-width="2" stroke-dasharray="3,3"/>
    <text id="end-label" x="900" y="86" fill="#42a5f5" font-size="11" text-anchor="middle" font-weight="bold">E</text>
  </g>
  <text id="brain-label" x="500" y="12" fill="#4fc3f7" font-size="11" text-anchor="middle" font-weight="bold" opacity="0"></text>
</svg>

<div id="panel">
  <h2>Mode</h2>
  <div class="mode">
    <button id="btn-sim" class="active">SIM</button>
    <button id="btn-real">REAL</button>
  </div>
  <div id="conn-row" class="conn-row" style="display:none">
    <input id="pi-ip" placeholder="Pi IP" value="192.168.4.1" size="14">
    <button id="btn-connect" class="btn-neutral" style="width:80px">Connect</button>
    <span id="ws-stat" class="ws-status ws-off">off</span>
  </div>

  <h2>Sensors (cm)</h2>
  <label>Front <span id="v-front">20</span></label>
  <input id="s-front" type="range" min="20" max="600" value="20">
  <label>Left <span id="v-left">20</span></label>
  <input id="s-left" type="range" min="20" max="600" value="20">
  <label>Right <span id="v-right">20</span></label>
  <input id="s-right" type="range" min="20" max="600" value="20">

  <h2>Auto-Pilot</h2>
  <label>Max Speed <span id="v-speed">0.60</span></label>
  <input id="s-speed" type="range" min="0.1" max="1" step="0.05" value="0.6">
  <div class="btn-row" style="margin-top:6px">
    <button id="btn-auto-start" class="btn-start">Start</button>
    <button id="btn-auto-stop" class="btn-stop">Stop</button>
  </div>

  <h2>Telemetry</h2>
  <table class="telem">
    <tr><td>State</td><td id="t-state">IDLE</td></tr>
    <tr><td>Heading</td><td id="t-heading">0.0&deg;</td></tr>
    <tr><td>Position</td><td id="t-pos">(0,0)</td></tr>
    <tr><td>L / R Speed</td><td id="t-speeds">0.00 / 0.00</td></tr>
    <tr><td>Sonar F/L/R</td><td id="t-sonar">- / - / -</td></tr>
    <tr><td>Inside</td><td id="t-inside">yes</td></tr>
    <tr><td>Edge dist</td><td id="t-edge">100 cm</td></tr>
    <tr><td>Obstacles</td><td id="t-obstacles">0</td></tr>
  </table>

  <div class="btn-row">
    <button id="btn-reset" class="btn-neutral">Reset</button>
    <button id="btn-clear-obs" class="btn-neutral">Clear Obstacles</button>
    <button id="btn-dump" class="btn-neutral" style="background:#1a3a5c;color:#4fc3f7;margin-top:4px">Dump Debug</button>
  </div>
</div>

<script>
(function() {
  // --- config (mirrors navigation/config.py) ---
  var PW = 1000, PH = 200,
      DUCK_R = 15,
      OBST_TH = 50, MARGIN = 30,
      TURN_SP = 0.5, REVERSE_SPD = 0.5,
      MAX_SPD = 100, WB = 30, HDG_TOL = 0.02,
      AVOID_REVERSE_S = 0.5, AVOID_TURN_S = 0.5, AVOID_COOLDOWN_S = 0.3,
      STUCK_DIST_CM = 8, STUCK_WINDOW_S = 3, STUCK_ESCAPE_S = 1.5,
      ARRIVAL = 20,
      startX = 500, startY = 100, endX = 900, endY = 100;

  // --- state ---
  var mode = 'sim',
      duck = { x: startX, y: startY, th: 0, ls: 0, rs: 0 },
      sens = [20, 20, 20],
      debugBuf = [],
      debugLimit = 500,
      obstacles = [],
      autopilot = false,
      arrived = false,
      trail = [],
      dragging = null,
      maxSpeed = 0.6,
      ap = {
        avoidState: 'none',
        avoidTimer: 0,
        avoidTurnDir: null,
        escapeTimer: 0,
        escapeDir: 'left',
        posHistory: [],
        perimEscaping: false,
        escapeHeading: 0
      };

  // --- helpers ---
  var $ = function(id){ return document.getElementById(id); };
  var clamp = function(v,l,h){ return v<l?l:v>h?h:v; };
  var deg = function(r){ return (r*180/Math.PI).toFixed(1); };
  var np = function(){ return { x: duck.x+14*Math.cos(duck.th), y: duck.y+14*Math.sin(duck.th) }; };

  // --- DOM refs ---
  var svm = $('map'),
      elTrail = $('trail'), elDuck = $('duck'),
      elBF = $('beam-front'), elBL = $('beam-left'), elBR = $('beam-right'),
      elBFP = $('beam-front-pt'), elBLP = $('beam-left-pt'), elBRP = $('beam-right-pt'),
      elBrain = $('brain-label'), elObs = $('obstacles'),
      slF = $('s-front'), slL = $('s-left'), slR = $('s-right'), slSpd = $('s-speed');

  // --- physics (matches odometry.py) ---
  function obstacleAt(x, y) {
    for (var i = 0; i < obstacles.length; i++) {
      var o = obstacles[i];
      if (Math.hypot(x - o.x, y - o.y) < DUCK_R + o.r) return true;
    }
    return false;
  }

  function step(dt) {
    var vl = duck.ls * MAX_SPD, vr = duck.rs * MAX_SPD;
    var v = (vl+vr)/2, w = (vr-vl)/WB;
    var nx = duck.x + v * Math.cos(duck.th) * dt;
    var ny = duck.y + v * Math.sin(duck.th) * dt;
    nx = clamp(nx, DUCK_R, PW - DUCK_R);
    ny = clamp(ny, DUCK_R, PH - DUCK_R);
    if (!obstacleAt(nx, ny)) { duck.x = nx; duck.y = ny; }
    duck.th += w * dt;
    duck.th = Math.atan2(Math.sin(duck.th), Math.cos(duck.th));
  }

  // --- raycast (line + circle intersection) ---
  function ray(ox, oy, ang) {
    var best = 9999, dx = Math.cos(ang), dy = Math.sin(ang);
    function hit(x3,y3,x4,y4) {
      var d = dx*(y3-y4) - dy*(x3-x4);
      if (Math.abs(d) < 1e-9) return;
      var t = ((ox-x3)*(y3-y4) - (oy-y3)*(x3-x4)) / d;
      var u = -((dx*(oy-y3) - dy*(ox-x3))) / d;
      if (t>=0 && u>=0 && u<=1) { var dist = Math.hypot(ox+dx*t-ox, oy+dy*t-oy); if (dist<best) best=dist; }
    }
    hit(0,0,PW,0); hit(PW,0,PW,PH); hit(PW,PH,0,PH); hit(0,PH,0,0);
    for (var i=0; i<obstacles.length; i++) {
      var o = obstacles[i], fx=ox-o.x, fy=oy-o.y;
      var a=dx*dx+dy*dy, b=2*(fx*dx+fy*dy), c=fx*fx+fy*fy-o.r*o.r, disc=b*b-4*a*c;
      if (disc<0) continue;
      var t1=(-b-Math.sqrt(disc))/(2*a), t2=(-b+Math.sqrt(disc))/(2*a);
      if (t1>=0&&t1<best) best=t1; else if (t2>=0&&t2<best) best=t2;
    }
    return best<9999 ? best : null;
  }

  // --- render ---
  function render() {
    var n = np();
    elDuck.setAttribute('transform', 'translate('+duck.x+','+duck.y+') rotate('+deg(duck.th)+')');
    $('duck-ring').setAttribute('cx', duck.x);
    $('duck-ring').setAttribute('cy', duck.y);
    if (arrived) {
      var pulse = Math.sin(performance.now() / 400) * 0.5 + 0.5;
      var rv = Math.floor(255 * (1 - pulse)), gv = Math.floor(100 + 155 * pulse);
      elDuck.setAttribute('fill', 'rgb('+rv+','+gv+',68)');
      elDuck.setAttribute('stroke', 'rgb('+(rv+34)+','+(gv+34)+',102)');
    } else {
      elDuck.setAttribute('fill', '#ff4444');
      elDuck.setAttribute('stroke', '#ff6666');
    }
    var dirs = [0, -Math.PI/4, Math.PI/4];
    var beams = [elBF, elBL, elBR], bpts = [elBFP, elBLP, elBRP];
    for (var i=0; i<3; i++) {
      var ang = duck.th + dirs[i], dcm = sens[i];
      if (dcm <= 0) dcm = 0.1;
      var ex = n.x + dcm*Math.cos(ang), ey = n.y + dcm*Math.sin(ang);
      beams[i].setAttribute('x1',n.x); beams[i].setAttribute('y1',n.y);
      beams[i].setAttribute('x2',ex); beams[i].setAttribute('y2',ey);
      bpts[i].setAttribute('cx',ex); bpts[i].setAttribute('cy',ey);
      bpts[i].setAttribute('opacity','1');
    }
    var pts = '';
    for (var j=0; j<trail.length; j++) pts += trail[j].x+','+trail[j].y+' ';
    if (!pts) pts = '0,0 0,0';
    elTrail.setAttribute('points', pts);
    var oh = '';
    for (var k=0; k<obstacles.length; k++)
      oh += '<circle cx="'+obstacles[k].x+'" cy="'+obstacles[k].y+'" r="'+obstacles[k].r+'" fill="#ff4444" fill-opacity="0.3" stroke="#ff6666" stroke-width="1"/>';
    elObs.innerHTML = oh;
  }

  function renderTelemetry() {
    var inside = duck.x>=1 && duck.x<=PW-1 && duck.y>=1 && duck.y<=PH-1;
    var edges = [duck.x, PW-duck.x, duck.y, PH-duck.y];
    var stateLabel = arrived ? 'ARRIVED' : (!autopilot ? 'IDLE'
      : (ap.perimEscaping ? 'PERIM' : (ap.escapeTimer > 0 ? 'ESCAPE' : (ap.avoidState !== 'none' ? ap.avoidState.toUpperCase() : 'GO'))));
    $('t-state').textContent = stateLabel;
    $('t-heading').innerHTML = deg(duck.th)+'&deg;';
    $('t-pos').textContent = '('+duck.x.toFixed(0)+', '+duck.y.toFixed(0)+')';
    $('t-speeds').textContent = duck.ls.toFixed(2)+' / '+duck.rs.toFixed(2);
    $('t-sonar').textContent = sens.map(function(s){ return s>0 ? s : '-'; }).join(' / ');
    $('t-inside').textContent = inside ? 'yes' : 'OUTSIDE!';
    $('t-edge').textContent = Math.min.apply(null, edges).toFixed(0)+' cm';
    $('t-obstacles').textContent = obstacles.length;
  }

  // --- auto-pilot (phased REVERSE→TURN→COOLDOWN avoid, goal-seeking, position-based stuck detection) ---
  function autoPilot(dt) {
    var distToEnd = Math.hypot(duck.x - endX, duck.y - endY);
    if (distToEnd < ARRIVAL) { arrived = true; return [0, 0]; }
    if (arrived) arrived = false;

    var goalTh = Math.atan2(endY - duck.y, endX - duck.x);
    var goalErr = ((goalTh - duck.th + Math.PI) % (2 * Math.PI)) - Math.PI;
    var f = sens[0], l = sens[1], r = sens[2];
    var obsDist = OBST_TH + DUCK_R;

    var now = performance.now() / 1000;
    if (!ap.perimEscaping) {
      ap.posHistory.push({x: duck.x, y: duck.y, t: now});
      var tCutoff = now - STUCK_WINDOW_S;
      ap.posHistory = ap.posHistory.filter(function(p) { return p.t > tCutoff; });
      var posStuck = false;
      if (ap.posHistory.length >= 2) {
        var p0 = ap.posHistory[0], pn = ap.posHistory[ap.posHistory.length - 1];
        if (pn.t - p0.t >= STUCK_WINDOW_S && Math.hypot(pn.x - p0.x, pn.y - p0.y) < STUCK_DIST_CM) {
          posStuck = true;
        }
      }

      if (ap.escapeTimer > 0) {
        ap.escapeTimer -= dt;
        return ap.escapeDir === 'left'
          ? [-REVERSE_SPD, TURN_SP] : [TURN_SP, -REVERSE_SPD];
      }

      if (posStuck) {
        ap.escapeTimer = STUCK_ESCAPE_S;
        ap.escapeDir = ap.escapeDir === 'left' ? 'right' : 'left';
        return ap.escapeDir === 'left'
          ? [-REVERSE_SPD, TURN_SP] : [TURN_SP, -REVERSE_SPD];
      }
    }

    var near = Math.min(duck.x, PW - duck.x, duck.y, PH - duck.y);
    if (near < MARGIN && !ap.perimEscaping) {
      var dx = 0, dy = 0;
      if (duck.x < MARGIN) dx = MARGIN - duck.x;
      if (PW - duck.x < MARGIN) dx -= (duck.x - (PW - MARGIN));
      if (duck.y < MARGIN) dy = MARGIN - duck.y;
      if (PH - duck.y < MARGIN) dy -= (duck.y - (PH - MARGIN));
      ap.escapeHeading = Math.atan2(dy, dx);
      ap.perimEscaping = true;
      ap.avoidState = 'none'; ap.avoidTimer = 0;
      ap.posHistory = [];
    }
    if (near > MARGIN * 2) ap.perimEscaping = false;

    if (ap.perimEscaping) {
      var perr = ((ap.escapeHeading - duck.th + Math.PI) % (2 * Math.PI)) - Math.PI;
      if (Math.abs(perr) < 0.08) return [maxSpeed, maxSpeed];
      return [-TURN_SP * Math.sign(perr), TURN_SP * Math.sign(perr)];
    }

    if (ap.avoidState !== 'none') {
      ap.avoidTimer += dt;

      if (ap.avoidState === 'reverse') {
        if (ap.avoidTimer >= AVOID_REVERSE_S) {
          ap.avoidState = 'turn'; ap.avoidTimer = 0;
        }
        return [-REVERSE_SPD, -REVERSE_SPD];
      }

      if (ap.avoidState === 'turn') {
        if (ap.avoidTimer >= AVOID_TURN_S) {
          ap.avoidState = 'cooldown'; ap.avoidTimer = 0;
        }
        return ap.avoidTurnDir === 'left'
          ? [TURN_SP, -TURN_SP] : [-TURN_SP, TURN_SP];
      }

      if (ap.avoidState === 'cooldown') {
        if (ap.avoidTimer >= AVOID_COOLDOWN_S) {
          ap.avoidState = 'none'; ap.avoidTimer = 0;
        }
      }
    }

    if (ap.avoidState === 'none' && f > 0 && f < obsDist) {
      ap.avoidState = 'reverse'; ap.avoidTimer = 0;
      ap.avoidTurnDir = l > r ? 'left' : 'right';
      return [-REVERSE_SPD, -REVERSE_SPD];
    }

    if (l > 0 && l < obsDist) return [maxSpeed * 0.3, maxSpeed];
    if (r > 0 && r < obsDist) return [maxSpeed, maxSpeed * 0.3];

    if (Math.abs(goalErr) < HDG_TOL) return [maxSpeed, maxSpeed];

    var turnDir = Math.sign(goalErr);
    if (Math.abs(goalErr) > Math.PI / 2) return [-TURN_SP * turnDir, TURN_SP * turnDir];
    var ratio = Math.abs(goalErr) / (Math.PI / 2);
    var innerSpeed = maxSpeed * (1 - ratio * 0.7);
    return goalErr > 0 ? [innerSpeed, maxSpeed] : [maxSpeed, innerSpeed];
  }

  function setDrive(ls,rs){ if (mode==='sim') { arrived = false; duck.ls=clamp(ls,-1,1); duck.rs=clamp(rs,-1,1); } }

  function resetAll() {
    duck.x = startX; duck.y = startY; duck.th = 0; duck.ls = 0; duck.rs = 0;
    arrived = false;
    sens = [20, 20, 20]; trail = [];
    ap = {
      avoidState: 'none', avoidTimer: 0, avoidTurnDir: null,
      escapeTimer: 0, escapeDir: 'left', posHistory: [], perimEscaping: false, escapeHeading: 0
    };
    syncSliders();
  }

  function syncSliders() {
    slF.value=sens[0]; $('v-front').textContent=sens[0];
    slL.value=sens[1]; $('v-left').textContent=sens[1];
    slR.value=sens[2]; $('v-right').textContent=sens[2];
  }

  // --- main loop ---
  var lastT = 0;
  function loop(t) {
    var dt = lastT ? Math.min((t-lastT)/1000, 0.1) : 0.016; lastT = t;
    if (autopilot && mode !== 'real') {
      var n = np();
      sens[0] = ray(n.x, n.y, duck.th) || 9999;
      sens[1] = ray(n.x, n.y, duck.th - Math.PI / 4) || 9999;
      sens[2] = ray(n.x, n.y, duck.th + Math.PI / 4) || 9999;
      $('v-front').textContent = sens[0].toFixed(0);
      $('v-left').textContent = sens[1].toFixed(0);
      $('v-right').textContent = sens[2].toFixed(0);
      var sp = autoPilot(dt);
      duck.ls = sp[0]; duck.rs = sp[1];
    }
    step(dt);
    trail.push({x:duck.x, y:duck.y}); if (trail.length>40) trail.shift();
    render(); renderTelemetry();
    if (autopilot) {
      debugBuf.push({
        t: (t/1000).toFixed(2), x: duck.x.toFixed(1), y: duck.y.toFixed(1),
        th: deg(duck.th), ls: duck.ls.toFixed(2), rs: duck.rs.toFixed(2),
        f: sens[0].toFixed(0), l: sens[1].toFixed(0), r: sens[2].toFixed(0),
        near: Math.min(duck.x,PW-duck.x,duck.y,PH-duck.y).toFixed(0),
        perimEscaping: ap.perimEscaping, avoidState: ap.avoidState,
        escapeTimer: ap.escapeTimer.toFixed(2)
      });
      if (debugBuf.length > debugLimit) debugBuf.shift();
      var live = {
        f: debugBuf.length, t: (t/1000).toFixed(1),
        x: duck.x.toFixed(0), y: duck.y.toFixed(0), th: deg(duck.th),
        ls: duck.ls.toFixed(2), rs: duck.rs.toFixed(2),
        sf: sens[0].toFixed(0), sl: sens[1].toFixed(0), sr: sens[2].toFixed(0),
        near: Math.min(duck.x,PW-duck.x,duck.y,PH-duck.y).toFixed(0),
        pe: ap.perimEscaping, as: ap.avoidState, et: ap.escapeTimer.toFixed(2)
      };
      if (debugBuf.length < 3 || debugBuf.length % 3 === 0) {
        fetch('/push', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(live)}).catch(function(){});
      }
    }
    requestAnimationFrame(loop);
  }

  // --- sensor sliders ---
  slF.oninput = function(){ sens[0]=+this.value; $('v-front').textContent=sens[0]; };
  slL.oninput = function(){ sens[1]=+this.value; $('v-left').textContent=sens[1]; };
  slR.oninput = function(){ sens[2]=+this.value; $('v-right').textContent=sens[2]; };
  slSpd.oninput = function(){ maxSpeed = +this.value; $('v-speed').textContent = this.value; };

  // --- click to add obstacle (right-click to remove) ---
  svm.addEventListener('click', function(e) {
    if (mode === 'real' || dragging || e.button !== 0) return;
    var r = svm.getBoundingClientRect();
    var x = (e.clientX - r.left) * (PW / r.width);
    var y = (e.clientY - r.top) * (PH / r.height);
    if (x < 2 || x > PW - 2 || y < 2 || y > PH - 2) return;
    if (Math.hypot(x - startX, y - startY) < DUCK_R + 10) return;
    if (Math.hypot(x - endX, y - endY) < DUCK_R + 10) return;
    for (var i = 0; i < obstacles.length; i++)
      if (Math.hypot(x - obstacles[i].x, y - obstacles[i].y) < obstacles[i].r + 10) return;
    obstacles.push({x: x, y: y, r: 5 + Math.random() * 10});
  });

  svm.addEventListener('contextmenu', function(e) {
    e.preventDefault();
    if (mode === 'real') return;
    var r = svm.getBoundingClientRect();
    var x = (e.clientX - r.left) * (PW / r.width);
    var y = (e.clientY - r.top) * (PH / r.height);
    for (var i = obstacles.length - 1; i >= 0; i--) {
      if (Math.hypot(x - obstacles[i].x, y - obstacles[i].y) < obstacles[i].r + 5) {
        obstacles.splice(i, 1);
        return;
      }
    }
  });

  // --- drag start/end markers ---
  $('start-marker').addEventListener('mousedown', function(e) {
    if (mode === 'real') return;
    dragging = 'start';
    e.stopPropagation();
  });
  $('end-marker').addEventListener('mousedown', function(e) {
    if (mode === 'real') return;
    dragging = 'end';
    e.stopPropagation();
  });

  svm.addEventListener('mousemove', function(e) {
    if (!dragging) return;
    var r = svm.getBoundingClientRect();
    var x = clamp((e.clientX - r.left) * (PW / r.width), 10, PW - 10);
    var y = clamp((e.clientY - r.top) * (PH / r.height), 10, PH - 10);
    if (dragging === 'start') {
      startX = x; startY = y;
      $('start-pt').setAttribute('cx', x);
      $('start-pt').setAttribute('cy', y);
      $('start-label').setAttribute('x', x);
      $('start-label').setAttribute('y', y - 14);
    } else {
      endX = x; endY = y;
      $('end-pt').setAttribute('cx', x);
      $('end-pt').setAttribute('cy', y);
      $('end-label').setAttribute('x', x);
      $('end-label').setAttribute('y', y - 14);
    }
  });

  document.addEventListener('mouseup', function() {
    if (dragging === 'start') {
      duck.x = startX; duck.y = startY; duck.th = 0;
      arrived = false;
    }
    dragging = null;
  });

  // --- mode switching ---
  var es = null;
  $('btn-sim').onclick = function(){
    mode='sim'; this.classList.add('active'); $('btn-real').classList.remove('active');
    $('conn-row').style.display='none'; $('btn-auto-start').disabled=false; $('btn-auto-stop').disabled=false;
    slF.disabled=false; slL.disabled=false; slR.disabled=false;
    if (es) { es.close(); es=null; } $('ws-stat').className='ws-status ws-off'; $('ws-stat').textContent='off';
    arrived = false; dragging = null;
    startX = 500; startY = 100; endX = 900; endY = 100;
    $('start-pt').setAttribute('cx', startX); $('start-pt').setAttribute('cy', startY);
    $('start-label').setAttribute('x', startX); $('start-label').setAttribute('y', startY - 14);
    $('end-pt').setAttribute('cx', endX); $('end-pt').setAttribute('cy', endY);
    $('end-label').setAttribute('x', endX); $('end-label').setAttribute('y', endY - 14);
    resetAll();
  };
  $('btn-real').onclick = function(){
    mode='real'; this.classList.add('active'); $('btn-sim').classList.remove('active');
    $('conn-row').style.display='flex'; autopilot=false;
    $('btn-auto-start').disabled=true; $('btn-auto-stop').disabled=true;
    slF.disabled=true; slL.disabled=true; slR.disabled=true;
  };

  $('btn-connect').onclick = function(){
    if (es) { es.close(); es=null; }
    var ip = $('pi-ip').value.trim();
    if (this.textContent === 'Disconnect') { $('ws-stat').className='ws-status ws-off'; $('ws-stat').textContent='off'; this.textContent='Connect'; return; }
    es = new EventSource('http://'+ip+':8080/stream');
    es.onopen = function(){
      $('ws-stat').className='ws-status ws-on'; $('ws-stat').textContent='live';
      $('btn-connect').textContent='Disconnect';
    };
    es.onmessage = function(e){
      var s = JSON.parse(e.data);
      duck.x=s.x_cm; duck.y=s.y_cm; duck.th=s.theta_rad;
      duck.ls=s.left_speed; duck.rs=s.right_speed;
      sens[0]=s.sonar_front||0; sens[1]=s.sonar_left||0; sens[2]=s.sonar_right||0;
      elBrain.setAttribute('opacity','1');
      elBrain.textContent = s.brain_state + (s.avoid_phase ? ' / '+s.avoid_phase : '');
      $('t-state').textContent = s.brain_state || 'REAL';
      syncSliders();
    };
    es.onerror = function(){
      $('ws-stat').className='ws-status ws-off'; $('ws-stat').textContent='lost';
      $('btn-connect').textContent='Reconnect';
      elBrain.setAttribute('opacity','0');
    };
  };

  // --- buttons ---
  $('btn-auto-start').onclick = function(){ autopilot=true; arrived=false; setDrive(0,0); };
  $('btn-auto-stop').onclick = function(){ autopilot=false; arrived=false; setDrive(0,0); };
  $('btn-reset').onclick = function(){ resetAll(); };
  $('btn-clear-obs').onclick = function(){ obstacles=[]; };
  $('btn-dump').onclick = function(){
    var blob = new Blob([JSON.stringify({
      config: {PW: PW, PH: PH, MARGIN: MARGIN, DUCK_R: DUCK_R, OBST_TH: OBST_TH, maxSpeed: maxSpeed, HDG_TOL: HDG_TOL},
      start: {x: startX, y: startY}, end: {x: endX, y: endY},
      obstacles: obstacles.map(function(o){ return {x: o.x.toFixed(0), y: o.y.toFixed(0), r: o.r.toFixed(0)}; }),
      frames: debugBuf
    }, null, 2)], {type: 'application/json'});
    var a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'duckbot-debug-' + new Date().toISOString().replace(/:/g,'-').slice(0,19) + '.json';
    a.click();
    debugBuf = [];
  };

  // --- start ---
  syncSliders(); $('conn-row').style.display='none';
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
