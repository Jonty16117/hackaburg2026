<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>DuckBot Dashboard</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font:14px/1.4 monospace;background:#0d1b2a;color:#e0e0e0;display:flex;height:100vh;overflow:hidden}
#map text{user-select:none;-webkit-user-select:none}
#map{flex:1;background:#0a1628;cursor:crosshair;min-width:0}
#panel{width:280px;background:#111d2e;padding:12px;overflow-y:auto;display:flex;flex-direction:column;gap:10px;border-left:2px solid #1a3a5c}
h2{font-size:13px;color:#4fc3f7;text-transform:uppercase;letter-spacing:1px;border-bottom:1px solid #1a3a5c;padding-bottom:4px;margin-top:4px}
.mode{display:flex;gap:4px}
.mode button{flex:1;padding:6px;border:none;cursor:pointer;font:inherit;font-weight:bold;border-radius:4px;background:#1a3a5c;color:#889}
.mode button.active{background:#1565c0;color:#fff}
.ws-status{font-size:11px;padding:2px 6px;border-radius:3px;display:inline-block}
.ws-on{background:#1b5e20;color:#81c784}
.ws-off{background:#4a1a1a;color:#ef9a9a}
label{font-size:12px;color:#90a4ae;display:flex;justify-content:space-between;align-items:center}
label span{min-width:42px;text-align:right;color:#4fc3f7;font-weight:bold}
input[type=range]{width:100%;accent-color:#4fc3f7;margin:2px 0}
input[type=text]{padding:4px 6px;border:1px solid #1a3a5c;background:#0d1b2a;color:#e0e0e0;border-radius:3px;font:inherit}
.btn-row{display:flex;gap:4px}
.btn-row button{flex:1;padding:6px;border:none;cursor:pointer;font:inherit;font-weight:bold;border-radius:4px}
.btn-start{background:#1b5e20;color:#81c784}
.btn-stop{background:#4a1a1a;color:#ef9a9a}
.btn-neutral{background:#1a3a5c;color:#ccc}
.telem{font-size:12px;width:100%}
.telem td{padding:2px 6px}
.telem td:first-child{color:#90a4ae;text-align:right;white-space:nowrap}
.telem td:last-child{color:#4fc3f7;font-weight:bold}
.conn-row{display:flex;gap:4px;align-items:center}
#pi-ip{flex:1}
button:disabled{opacity:0.4;cursor:default}
</style>
</head>
<body>

<svg id="map" viewBox="-30 -10 1060 220" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <pattern id="grid" width="50" height="50" patternUnits="userSpaceOnUse">
      <path d="M 50 0 L 0 0 0 50" fill="none" stroke="#123456" stroke-width="0.3"/>
    </pattern>
  </defs>
  <rect x="0" y="0" width="1000" height="200" fill="url(#grid)"/>
  <rect x="0" y="0" width="1000" height="200" fill="none" stroke="#2d6ea0" stroke-width="3" rx="4"/>
  <text x="500" y="110" fill="#123456" font-size="20" text-anchor="middle" opacity="0.4">DuckBot Pool</text>
  <text x="500" y="192" fill="#1a3a5c" font-size="10" text-anchor="middle">1000 cm (10 m)</text>
  <g id="obstacles"></g>
  <polyline id="trail" fill="none" stroke="#00ff8850" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" pointer-events="none"/>
  <g id="wall-estimates">
    <line id="ew-0" x1="0" y1="0" x2="0" y2="0" stroke="#4fc3f7" stroke-width="2" stroke-dasharray="6,4" opacity="0" pointer-events="none"/>
    <line id="ew-1" x1="0" y1="0" x2="0" y2="0" stroke="#4fc3f7" stroke-width="2" stroke-dasharray="6,4" opacity="0" pointer-events="none"/>
    <line id="ew-2" x1="0" y1="0" x2="0" y2="0" stroke="#4fc3f7" stroke-width="2" stroke-dasharray="6,4" opacity="0" pointer-events="none"/>
    <line id="ew-3" x1="0" y1="0" x2="0" y2="0" stroke="#4fc3f7" stroke-width="2" stroke-dasharray="6,4" opacity="0" pointer-events="none"/>
    <text id="ew-label" x="500" y="22" fill="#4fc3f7" font-size="9" text-anchor="middle" opacity="0" pointer-events="none"></text>
  </g>
  <line id="beam-front" x1="0" y1="0" x2="0" y2="0" stroke="#00ff8860" stroke-width="2" stroke-linecap="round" pointer-events="none"/>
  <line id="beam-left" x1="0" y1="0" x2="0" y2="0" stroke="#ffcc0060" stroke-width="2" stroke-linecap="round" pointer-events="none"/>
  <line id="beam-right" x1="0" y1="0" x2="0" y2="0" stroke="#ffcc0060" stroke-width="2" stroke-linecap="round" pointer-events="none"/>
  <circle id="beam-front-pt" cx="0" cy="0" r="3" fill="#00ff88" opacity="0" pointer-events="none"/>
  <circle id="beam-left-pt" cx="0" cy="0" r="3" fill="#ffcc00" opacity="0" pointer-events="none"/>
  <circle id="beam-right-pt" cx="0" cy="0" r="3" fill="#ffcc00" opacity="0" pointer-events="none"/>
  <circle id="duck-ring" cx="500" cy="100" r="15" fill="none" stroke="#ff8800" stroke-opacity="0.4" stroke-width="2" stroke-dasharray="4,3" pointer-events="none"/>
  <polygon id="duck" points="0,-7 16,0 0,7" fill="#ff4444" stroke="#ff6666" stroke-width="1.5" stroke-linejoin="round"/>
  <g id="start-marker" cursor="grab">
    <circle id="start-pt" cx="500" cy="100" r="5" fill="#00ff88" stroke="#00ff88" stroke-width="1.5"/>
    <text id="start-label" x="500" y="86" fill="#00ff88" font-size="11" text-anchor="middle" font-weight="bold">S</text>
  </g>
  <g id="end-marker" cursor="grab">
    <circle id="end-pt" cx="900" cy="100" r="5" fill="none" stroke="#42a5f5" stroke-width="2" stroke-dasharray="3,3"/>
    <text id="end-label" x="900" y="86" fill="#42a5f5" font-size="11" text-anchor="middle" font-weight="bold">E</text>
  </g>
  <text id="brain-label" x="500" y="12" fill="#4fc3f7" font-size="11" text-anchor="middle" font-weight="bold" opacity="0"></text>
</svg>

<div id="panel">
  <h2>Mode</h2>
  <div class="mode">
    <button id="btn-sim" class="active">SIM</button>
    <button id="btn-real">REAL</button>
  </div>
  <div id="conn-row" class="conn-row" style="display:none">
    <input id="pi-ip" placeholder="Pi IP" value="192.168.4.1" size="14">
    <button id="btn-connect" class="btn-neutral" style="width:80px">Connect</button>
    <span id="ws-stat" class="ws-status ws-off">off</span>
  </div>

  <h2>Sensors (cm)</h2>
  <label>Front <span id="v-front">20</span></label>
  <input id="s-front" type="range" min="20" max="600" value="20">
  <label>Left <span id="v-left">20</span></label>
  <input id="s-left" type="range" min="20" max="600" value="20">
  <label>Right <span id="v-right">20</span></label>
  <input id="s-right" type="range" min="20" max="600" value="20">

  <h2>Auto-Pilot</h2>
  <label>Max Speed <span id="v-speed">0.60</span></label>
  <input id="s-speed" type="range" min="0.1" max="1" step="0.05" value="0.6">
  <div class="btn-row" style="margin-top:6px">
    <button id="btn-auto-start" class="btn-start">Start</button>
    <button id="btn-auto-stop" class="btn-stop">Stop</button>
  </div>

  <h2>Telemetry</h2>
  <table class="telem">
    <tr><td>State</td><td id="t-state">IDLE</td></tr>
    <tr><td>Heading</td><td id="t-heading">0.0&deg;</td></tr>
    <tr><td>Position</td><td id="t-pos">(0,0)</td></tr>
    <tr><td>L / R Speed</td><td id="t-speeds">0.00 / 0.00</td></tr>
    <tr><td>Sonar F/L/R</td><td id="t-sonar">- / - / -</td></tr>
    <tr><td>Inside</td><td id="t-inside">yes</td></tr>
    <tr><td>Edge dist</td><td id="t-edge">100 cm</td></tr>
    <tr><td>Obstacles</td><td id="t-obstacles">0</td></tr>
    <tr><td>Wall Map</td><td id="t-walls">--</td></tr>
  </table>

  <div class="btn-row">
    <button id="btn-reset" class="btn-neutral">Reset</button>
    <button id="btn-clear-obs" class="btn-neutral">Clear Obstacles</button>
    <button id="btn-dump" class="btn-neutral" style="background:#1a3a5c;color:#4fc3f7;margin-top:4px">Dump Debug</button>
  </div>
  <div class="btn-row" style="margin-top:4px">
    <button id="btn-sweep" class="btn-neutral" style="background:#1b5e20;color:#81c784">Map Walls</button>
    <button id="btn-hide-walls" class="btn-neutral" style="background:#4a1a1a;color:#ef9a9a">Hide Walls</button>
  </div>
</div>

<script>
(function() {
  // --- helpers ---
  var $ = function(id){ return document.getElementById(id); };
  var deg = function(r){ return (r*180/Math.PI).toFixed(1); };
  var clamp = function(v,l,h){ return v<l?l:v>h?h:v; };

  // --- state (received from server) ---
  var duck = { x: 500, y: 100, th: 0, ls: 0, rs: 0, walls: null };
  var sens = [20, 20, 20];
  var trail = [];
  var obstacles = [];
  var arrived = false;
  var pf = 1000, ph = 200, duckR = 15;
  var startX = 500, startY = 100, endX = 900, endY = 100;
  var mode = 'sim', dragging = null;
  var wsConnected = false;

  // --- DOM refs ---
  var svm = $('map'),
      elTrail = $('trail'), elDuck = $('duck'),
      elBF = $('beam-front'), elBL = $('beam-left'), elBR = $('beam-right'),
      elBFP = $('beam-front-pt'), elBLP = $('beam-left-pt'), elBRP = $('beam-right-pt'),
      elBrain = $('brain-label'), elObs = $('obstacles'),
      slF = $('s-front'), slL = $('s-left'), slR = $('s-right'), slSpd = $('s-speed');

  var np = function(){ return { x: duck.x+14*Math.cos(duck.th), y: duck.y+14*Math.sin(duck.th) }; };
  var svgPoint = function(e){
    var pt = svm.createSVGPoint();
    pt.x = e.clientX; pt.y = e.clientY;
    return pt.matrixTransform(svm.getScreenCTM().inverse());
  };

  // --- render ---
  function renderWalls() {
    var wdata = duck.walls;
    var visible = wdata && wdata.walls && wdata.walls.length >= 2;
    for (var i = 0; i < 4; i++) {
      var el = document.getElementById('ew-' + i);
      if (!el) continue;
      if (!visible || !wdata.walls[i]) {
        el.setAttribute('opacity', '0');
        continue;
      }
      var w = wdata.walls[i];
      var A = w.A, B = w.B, C = w.C;
      var x1, y1, x2, y2;
      if (Math.abs(B) > 1e-9) {
        y1 = 0; x1 = -(B * y1 + C) / A;
        y2 = ph; x2 = -(B * y2 + C) / A;
      } else {
        x1 = -C / A; y1 = 0;
        x2 = x1; y2 = ph;
      }
      x1 = Math.max(-30, Math.min(pf + 30, x1));
      x2 = Math.max(-30, Math.min(pf + 30, x2));
      y1 = Math.max(-10, Math.min(ph + 10, y1));
      y2 = Math.max(-10, Math.min(ph + 10, y2));
      el.setAttribute('x1', x1);
      el.setAttribute('y1', y1);
      el.setAttribute('x2', x2);
      el.setAttribute('y2', y2);
      el.setAttribute('opacity', '0.85');
      el.setAttribute('stroke', w.locked ? '#4fc3f7' : '#ffcc00');
      el.setAttribute('stroke-dasharray', w.locked ? '6,4' : '4,4');
    }
    var lbl = document.getElementById('ew-label');
    if (lbl) {
      if (visible) {
        lbl.setAttribute('opacity', '0.9');
        lbl.textContent = wdata.phase + ' (' + wdata.walls_locked + '/4 locked)'
          + (wdata.corners && wdata.corners.length >= 4 ? '  ▣' : '');
      } else {
        lbl.setAttribute('opacity', '0');
      }
    }
  }

  function render() {
    var n = np();
    elDuck.setAttribute('transform', 'translate('+duck.x+','+duck.y+') rotate('+deg(duck.th)+')');
    $('duck-ring').setAttribute('cx', duck.x);
    $('duck-ring').setAttribute('cy', duck.y);
    $('duck-ring').setAttribute('r', duckR);
    if (arrived) {
      var pulse = Math.sin(performance.now() / 400) * 0.5 + 0.5;
      var rv = Math.floor(255 * (1 - pulse)), gv = Math.floor(100 + 155 * pulse);
      elDuck.setAttribute('fill', 'rgb('+rv+','+gv+',68)');
      elDuck.setAttribute('stroke', 'rgb('+(rv+34)+','+(gv+34)+',102)');
    } else {
      elDuck.setAttribute('fill', '#ff4444');
      elDuck.setAttribute('stroke', '#ff6666');
    }
    var dirs = [0, -Math.PI/4, Math.PI/4];
    var beams = [elBF, elBL, elBR], bpts = [elBFP, elBLP, elBRP];
    for (var i=0; i<3; i++) {
      var ang = duck.th + dirs[i], dcm = sens[i];
      if (dcm <= 0) dcm = 0.1;
      var ex = n.x + dcm*Math.cos(ang), ey = n.y + dcm*Math.sin(ang);
      beams[i].setAttribute('x1',n.x); beams[i].setAttribute('y1',n.y);
      beams[i].setAttribute('x2',ex); beams[i].setAttribute('y2',ey);
      bpts[i].setAttribute('cx',ex); bpts[i].setAttribute('cy',ey);
      bpts[i].setAttribute('opacity','1');
    }
    var pts = '';
    for (var j=0; j<trail.length; j++) pts += trail[j].x+','+trail[j].y+' ';
    if (!pts) pts = '0,0 0,0';
    elTrail.setAttribute('points', pts);
    var oh = '';
    for (var k=0; k<obstacles.length; k++)
      oh += '<circle cx="'+obstacles[k].x+'" cy="'+obstacles[k].y+'" r="'+obstacles[k].r+'" fill="#ff4444" fill-opacity="0.3" stroke="#ff6666" stroke-width="1"/>';
    elObs.innerHTML = oh;
    renderWalls();
  }

  function renderTelemetry() {
    var inside = duck.x>=1 && duck.x<=pf-1 && duck.y>=1 && duck.y<=ph-1;
    var edges = [duck.x, pf-duck.x, duck.y, ph-duck.y];
    var stateLabel = arrived ? 'ARRIVED' : 'LIVE';
    $('t-state').textContent = stateLabel;
    $('t-heading').innerHTML = deg(duck.th)+'&deg;';
    $('t-pos').textContent = '('+duck.x.toFixed(0)+', '+duck.y.toFixed(0)+')';
    $('t-speeds').textContent = duck.ls.toFixed(2)+' / '+duck.rs.toFixed(2);
    $('t-sonar').textContent = sens.map(function(s){ return s>0 ? s : '-'; }).join(' / ');
    $('t-inside').textContent = inside ? 'yes' : 'OUTSIDE!';
    $('t-edge').textContent = Math.min.apply(null, edges).toFixed(0)+' cm';
    $('t-obstacles').textContent = obstacles.length;
    if (duck.walls && duck.walls.phase) {
      $('t-walls').textContent = duck.walls.phase + ' (' + duck.walls.walls_locked + '/4)';
    } else {
      $('t-walls').textContent = '--';
    }
  }

  function updateFromServer(s) {
    duck.x = s.x_cm || duck.x;
    duck.y = s.y_cm || duck.y;
    duck.th = s.theta_rad || duck.th;
    duck.ls = s.left_speed || 0;
    duck.rs = s.right_speed || 0;
    sens[0] = s.sonar_front || 20;
    sens[1] = s.sonar_left || 20;
    sens[2] = s.sonar_right || 20;
    arrived = s.arrived || false;
    pf = (s.config && s.config.PW) || 1000;
    ph = (s.config && s.config.PH) || 200;
    duckR = (s.config && s.config.DUCK_R) || 15;
    if (s.start) { startX = s.start.x; startY = s.start.y; }
    if (s.end) { endX = s.end.x; endY = s.end.y; }
    obstacles = s.obstacles || [];
    if (s.trail) trail = s.trail;
    duck.walls = s.walls || null;
    // markers
    $('start-pt').setAttribute('cx', startX);
    $('start-pt').setAttribute('cy', startY);
    $('start-label').setAttribute('x', startX);
    $('start-label').setAttribute('y', startY - 14);
    $('end-pt').setAttribute('cx', endX);
    $('end-pt').setAttribute('cy', endY);
    $('end-label').setAttribute('x', endX);
    $('end-label').setAttribute('y', endY - 14);
    // brain label
    elBrain.setAttribute('opacity', s.autopilot ? '1' : '0');
    elBrain.textContent = s.brain_state || (s.autopilot ? 'GO' : '');
    // sync sliders
    slF.value = sens[0]; $('v-front').textContent = sens[0];
    slL.value = sens[1]; $('v-left').textContent = sens[1];
    slR.value = sens[2]; $('v-right').textContent = sens[2];
  }

  // --- main loop (render only) ---
  function loop() {
    render(); renderTelemetry();
    requestAnimationFrame(loop);
  }

  // --- sensor sliders ---
  slF.oninput = function(){
    fetch('/api/sensors/sonar', {
      method:'PUT', headers:{'Content-Type':'application/json'},
      body:JSON.stringify({front: +this.value})
    }).catch(function(){});
    $('v-front').textContent = this.value;
  };
  slL.oninput = function(){
    fetch('/api/sensors/sonar', {
      method:'PUT', headers:{'Content-Type':'application/json'},
      body:JSON.stringify({left: +this.value})
    }).catch(function(){});
    $('v-left').textContent = this.value;
  };
  slR.oninput = function(){
    fetch('/api/sensors/sonar', {
      method:'PUT', headers:{'Content-Type':'application/json'},
      body:JSON.stringify({right: +this.value})
    }).catch(function(){});
    $('v-right').textContent = this.value;
  };
  slSpd.oninput = function(){
    fetch('/api/config', {
      method:'PUT', headers:{'Content-Type':'application/json'},
      body:JSON.stringify({max_speed: +this.value})
    }).catch(function(){});
    $('v-speed').textContent = this.value;
  };

  // --- click empty space to create obstacle ---
  svm.addEventListener('click', function(e) {
    if (mode === 'real' || dragging || e.button !== 0) return;
    var p = svgPoint(e);
    if (p.x < 2 || p.x > pf - 2 || p.y < 2 || p.y > ph - 2) return;
    if (Math.hypot(p.x - startX, p.y - startY) < duckR + 10) return;
    if (Math.hypot(p.x - endX, p.y - endY) < duckR + 10) return;
    fetch('/api/obstacles', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body:JSON.stringify({x: p.x, y: p.y, r: 5 + Math.random() * 10})
    }).catch(function(){});
  });

  // --- mouseup on obstacle circle to delete ---
  elObs.addEventListener('mouseup', function(e) {
    if (e.target.tagName.toLowerCase() !== 'circle') return;
    e.stopPropagation();
    var idx = Array.prototype.indexOf.call(elObs.children, e.target);
    if (idx >= 0 && idx < obstacles.length) {
      fetch('/api/obstacles/' + obstacles[idx].id, {method:'DELETE'}).catch(function(){});
    }
  });
  elObs.addEventListener('click', function(e) {
    if (e.target.tagName.toLowerCase() !== 'circle') return;
    e.stopPropagation();
  });

  // --- drag start/end markers ---
  $('start-marker').addEventListener('mousedown', function(e) {
    if (mode === 'real') return;
    dragging = 'start';
    e.stopPropagation();
  });
  $('end-marker').addEventListener('mousedown', function(e) {
    if (mode === 'real') return;
    dragging = 'end';
    e.stopPropagation();
  });
  svm.addEventListener('mousemove', function(e) {
    if (!dragging) return;
    var p = svgPoint(e);
    var x = clamp(p.x, 10, pf - 10);
    var y = clamp(p.y, 10, ph - 10);
    if (dragging === 'start') {
      startX = x; startY = y;
      $('start-pt').setAttribute('cx', x);
      $('start-pt').setAttribute('cy', y);
      $('start-label').setAttribute('x', x);
      $('start-label').setAttribute('y', y - 14);
    } else {
      endX = x; endY = y;
      $('end-pt').setAttribute('cx', x);
      $('end-pt').setAttribute('cy', y);
      $('end-label').setAttribute('x', x);
      $('end-label').setAttribute('y', y - 14);
    }
  });
  document.addEventListener('mouseup', function() {
    if (dragging === 'start') {
      fetch('/api/sim/goal', {
        method:'PUT', headers:{'Content-Type':'application/json'},
        body:JSON.stringify({start: {x: startX, y: startY}})
      }).catch(function(){});
    } else if (dragging === 'end') {
      fetch('/api/sim/goal', {
        method:'PUT', headers:{'Content-Type':'application/json'},
        body:JSON.stringify({end: {x: endX, y: endY}})
      }).catch(function(){});
    }
    dragging = null;
  });

  // --- WebSocket connection (SIM mode) ---
  var ws = null;
  function connectWS() {
    if (ws) { ws.close(); ws = null; }
    ws = new WebSocket('ws://' + location.host + '/ws');
    ws.onmessage = function(e) {
      var msg = JSON.parse(e.data);
      if (msg.type === 'state') {
        updateFromServer(msg.data);
      }
    };
    ws.onclose = function() {
      setTimeout(connectWS, 2000);
    };
    ws.onerror = function() {};
  }

  // --- mode switching ---
  var es = null;
  $('btn-sim').onclick = function(){
    mode='sim'; this.classList.add('active'); $('btn-real').classList.remove('active');
    $('conn-row').style.display='none'; $('btn-auto-start').disabled=false; $('btn-auto-stop').disabled=false;
    slF.disabled=false; slL.disabled=false; slR.disabled=false;
    if (es) { es.close(); es=null; }
    $('ws-stat').className='ws-status ws-off'; $('ws-stat').textContent='ws off';
    wsConnected = false;
    // Connect WS after short delay
    setTimeout(connectWS, 100);
  };
  $('btn-real').onclick = function(){
    mode='real'; this.classList.add('active'); $('btn-sim').classList.remove('active');
    $('conn-row').style.display='flex';
    $('btn-auto-start').disabled=true; $('btn-auto-stop').disabled=true;
    slF.disabled=true; slL.disabled=true; slR.disabled=true;
    if (ws) { ws.close(); ws=null; }
  };

  $('btn-connect').onclick = function(){
    if (es) { es.close(); es=null; }
    var ip = $('pi-ip').value.trim();
    if (this.textContent === 'Disconnect') {
      $('ws-stat').className='ws-status ws-off'; $('ws-stat').textContent='off';
      this.textContent='Connect'; return;
    }
    es = new EventSource('http://'+ip+':8080/stream');
    es.onopen = function(){
      $('ws-stat').className='ws-status ws-on'; $('ws-stat').textContent='live';
      $('btn-connect').textContent='Disconnect';
    };
    es.onmessage = function(e){
      var s = JSON.parse(e.data);
      updateFromServer(s);
    };
    es.onerror = function(){
      $('ws-stat').className='ws-status ws-off'; $('ws-stat').textContent='lost';
      $('btn-connect').textContent='Reconnect';
      elBrain.setAttribute('opacity','0');
    };
  };

  // --- buttons ---
  $('btn-auto-start').onclick = function(){
    fetch('/api/autopilot/start', {method:'POST'}).catch(function(){});
  };
  $('btn-auto-stop').onclick = function(){
    fetch('/api/autopilot/stop', {method:'POST'}).catch(function(){});
  };
  $('btn-reset').onclick = function(){
    fetch('/api/duck/reset', {method:'POST'}).catch(function(){});
  };
  $('btn-clear-obs').onclick = function(){
    fetch('/api/obstacles', {method:'DELETE'}).catch(function(){});
  };
  $('btn-dump').onclick = function(){
    fetch('/api/sim/debug').then(function(r){ return r.json(); }).then(function(data){
      var blob = new Blob([JSON.stringify(data, null, 2)], {type:'application/json'});
      var a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = 'duckbot-debug-' + new Date().toISOString().replace(/:/g,'-').slice(0,19) + '.json';
      a.click();
    }).catch(function(){});
  };
  $('btn-sweep').onclick = function(){
    fetch('/api/walls/sweep', {method:'POST'}).catch(function(){});
  };
  $('btn-hide-walls').onclick = function(){
    fetch('/api/walls', {method:'DELETE'}).catch(function(){});
    duck.walls = null;
  };
  // --- read config on load ---
  fetch('/api/config').then(function(r){return r.json();}).then(function(cfg){
    if (cfg.sim && cfg.sim.ARRIVAL) duckR = cfg.sim.DUCK_R || 15;
    slSpd.value = (cfg.sim && cfg.sim.max_speed) || 0.6;
    $('v-speed').textContent = slSpd.value;
  }).catch(function(){});

  // --- start ---
  $('conn-row').style.display='none';
  setTimeout(connectWS, 200);
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
